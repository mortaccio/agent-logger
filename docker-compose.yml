services:
  log-agent:
    build: ./agents/summarizer
    container_name: log_agent
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: "host"
    environment:
      LOG_URL: http://localhost:8080/job/petclinic%20pipeline/lastBuild/consoleText
      LOG_SOURCE_USERNAME: ${LOG_SOURCE_USERNAME:-}
      LOG_SOURCE_PASSWORD: ${LOG_SOURCE_PASSWORD:-}
      LOG_SOURCE_AUTH_HEADER: ${LOG_SOURCE_AUTH_HEADER:-}
      OUTPUT_FILE: /output/analysis.md
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3:latest
      MAX_STEPS: "6"
      POLL_INTERVAL_SECONDS: "30"
      STATE_FILE: /output/.log-agent-state.json
      AGENT_QUESTION: >-
        Analyze the latest pipeline run log. Explain whether the run failed or
        succeeded, identify the top failure pattern if any, the likely root
        cause, concise evidence, next checks, and practical remediation steps.
      SYSTEM_PROMPT: >-
        You are an Azure DevOps pipeline log analysis agent. You do not receive
        the full log directly. Use the available tools to inspect only the parts
        you need. Start from compact tools such as get_log_overview,
        find_failure_markers, top_error_signatures, or likely_root_cause, and
        use search_logs or get_log_excerpt only when you need more evidence. Do
        not invent evidence. Keep evidence short and cite line numbers when
        possible. When you have enough information, return one valid JSON object
        only with these keys: summary, top_failure_pattern, likely_root_cause,
        confidence, evidence, next_checks. The confidence value must be one of:
        high, medium, low. The evidence and next_checks values must be arrays of
        short strings.
    volumes:
      - ./output:/output
    restart: unless-stopped
