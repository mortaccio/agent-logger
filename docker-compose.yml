services:
  log-agent:
    build: ./agents/summarizer
    container_name: log_agent
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: "host"
    environment:
      LOG_SOURCE: /data/input/pipeline.log
      LOG_SOURCE_USERNAME: ${LOG_SOURCE_USERNAME:-}
      LOG_SOURCE_PASSWORD: ${LOG_SOURCE_PASSWORD:-}
      LOG_SOURCE_AUTH_HEADER: ${LOG_SOURCE_AUTH_HEADER:-}
      OUTPUT_FILE: /output/analysis.md
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3:latest
      MAX_STEPS: "6"
      #POLL_INTERVAL_SECONDS: "30"
      STATE_FILE: /output/.log-agent-state.json
      AGENT_QUESTION: ${AGENT_QUESTION:-}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
    volumes:
      - ./data:/data:ro
      - ./output:/output
    restart: unless-stopped
